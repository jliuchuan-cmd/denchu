<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>電柱レコーダー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>電柱レコーダー</h1>
    <div class="bar-actions">
      <button id="btn-locate" title="現在地へ移動">📍 現在地</button>
      <button id="btn-list" title="一覧">📋 一覧 <span id="count">0</span></button>
      <button id="btn-settings" title="設定">⚙</button>
    </div>
  </header>

  <main>
    <div id="map"></div>
    <div id="hint" class="hint">地図タップで電柱を登録</div>
    <button id="btn-add-here" class="fab">＋ 現在地に登録</button>
    <div id="legend" class="legend"></div>
  </main>

  <!-- 登録・編集フォーム -->
  <dialog id="dlg-pole">
    <form id="form-pole" method="dialog">
      <h2 id="form-title">電柱を登録</h2>
      <p class="coords" id="form-coords"></p>

      <label>製造年
        <div class="row">
          <select name="era">
            <option value="ad">西暦</option>
            <option value="showa">昭和</option>
            <option value="heisei">平成</option>
            <option value="reiwa">令和</option>
          </select>
          <input name="yearInput" type="number" inputmode="numeric" min="1" max="2100" placeholder="例: 1985 / 60">
          <span id="year-ad" class="muted"></span>
        </div>
      </label>

      <label>電柱番号・名称（任意）
        <input name="number" type="text" placeholder="例: 東幹123 / 本町支線4">
      </label>

      <label>種別（任意）
        <select name="owner">
          <option value="">未選択</option>
          <option value="電力">電力柱</option>
          <option value="NTT">NTT柱</option>
          <option value="共架">共架柱</option>
          <option value="その他">その他</option>
        </select>
      </label>

      <label>写真（任意）
        <input name="photo" type="file" accept="image/*" capture="environment">
      </label>
      <img id="photo-preview" class="photo" alt="" hidden>

      <label>メモ（任意）
        <textarea name="memo" rows="2"></textarea>
      </label>

      <div class="form-actions">
        <button type="button" id="btn-delete" class="danger" hidden>削除</button>
        <span class="spacer"></span>
        <button type="button" id="btn-cancel">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 一覧 -->
  <dialog id="dlg-list" class="wide">
    <div class="dlg-head">
      <h2>登録済みの電柱</h2>
      <button type="button" data-close>✕</button>
    </div>
    <div class="row list-tools">
      <select id="sort">
        <option value="new">登録が新しい順</option>
        <option value="old-year">製造年が古い順</option>
        <option value="new-year">製造年が新しい順</option>
      </select>
      <button id="btn-export-csv">CSV出力</button>
      <button id="btn-export-json">JSON出力（バックアップ）</button>
      <label class="file-btn">JSON読込<input id="file-import" type="file" accept=".json,application/json" hidden></label>
    </div>
    <div id="stats" class="muted"></div>
    <ul id="pole-list" class="pole-list"></ul>
  </dialog>

  <!-- 設定 -->
  <dialog id="dlg-settings">
    <form id="form-settings" method="dialog">
      <h2>設定</h2>
      <label>Google Maps APIキー
        <input name="apiKey" type="text" autocomplete="off" placeholder="AIza...">
      </label>
      <p class="muted small">
        空欄の場合は OpenStreetMap で表示します（記録・出力機能は同じです）。
        キーはこの端末のブラウザ内にのみ保存されます。
      </p>
      <div class="form-actions">
        <span class="spacer"></span>
        <button type="button" data-close>キャンセル</button>
        <button type="submit" class="primary">保存して再読込</button>
      </div>
    </form>
  </dialog>

  <script src="db.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
